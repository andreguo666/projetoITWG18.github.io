<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Bejeweled - Em Jogo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/jogo.css">
    <!-- Grupo: 18, Número: 66567, Nome: Tiago Sun, PL: 21 -->
    <!-- Grupo: 18, Número: 66585, Nome: Lecheng Guo, PL: 21 -->
    <!-- Grupo: 18, Número: 66565, Nome: Xiaoqi Liu, PL: 21 -->
</head>
<body class="fundo-jogo">
    
    <header>
        <img src="imagens/bejeweled.jpg" alt="bejeweled logo" width="100" height="100">
        <h1>Bejeweled</h1>
    </header>

    <main class="area-batalha">
        
        <aside class="painel-lateral">
            <div class="caixa-status">
                <h3>Tempo</h3>
                <p class="numero-grande" id="timer">60</p>
            </div>

            <div class="caixa-status">
                <h3>Pontuação</h3>
                <p class="numero-grande" id="pontuacao-jogo">0</p>
            </div>

            <button id="btn-comecar" class="btn-sair" style="background-color: #4CAF50; color: white; border: none; cursor: pointer; margin-bottom: 10px;">
                Começar Jogo
            </button>
            <button id="btn-embaralhar" class="btn-sair" style="background-color: #ff9800; color: white; border: none; cursor: pointer; margin-bottom: 10px;">
                Embaralhar (-10 Pts)
            </button>
            <button id="btn-reiniciar" class="btn-sair" style="background-color: #2196F3; color: white; border: none; cursor: pointer; margin-bottom: 10px; display: none;">
                Jogar Novamente
            </button>
            <a href="escolhermodo.html" class="btn-sair">Sair do Jogo</a>
        </aside>

        <section class="tabuleiro-container">
    <div class="tabuleiro" id="tabuleiro-jogo">
        </div>
</section>

    </main>

    <footer>
        <p>ITW PL G18 2026</p>
    </footer>
    <audio src="video_e_musica/background_music.mp3" autoplay loop preload="auto">Seu navegador não suporta a tag de musica.</audio>
    <script src="js/jogo.js"></script>

<script src="js/footer.js"></script>
</body>
</html>

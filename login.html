<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - Bejeweled</title>
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
    <!-- Grupo: 18, Número: 66567, Nome: Tiago Sun, PL: 21 -->
    <!-- Grupo: 18, Número: 66585, Nome: Lecheng Guo, PL: 21 -->
    <!-- Grupo: 18, Número: 66565, Nome: Xiaoqi Liu, PL: 21 -->
</head>
<body>
    
    <header>
        <img src="imagens/bejeweled.jpg" alt="bejeweled logo" width="100" height="100">
        <h1>Bejeweled</h1>
    </header>

    <main class="main-login">
        
        <a href="index.html" class="btn-voltar">Voltar</a>

        <form id="loginForm" class="caixa-login">
            <h2>Login</h2>

            <div class="grupo-input">
                <label for="username">User Account</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="grupo-input">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <button type="button"  id="VERPASSWORD" onclick="togglePassword()"></button>
            </div>

            <div class="acoes-login">
                
                <div class="botoes-container">
                    <button type="submit" class="btn-acao">Log In</button>
                </div>
            </div>
        </form>
        <p id="message" name="message"></p>

    </main>

    <footer>
        <p>ITW PL G18 2026</p>
    </footer>
    <audio src="video_e_musica/background_music.mp3" autoplay loop preload="auto">Seu navegador não suporta a tag de musica.</audio>

<script src="js/footer.js"></script>
     <button id="btn-musica" class="menu-btn" style="padding:5px 10px;font-size: 12px;margin-left: 10px;">
        Musica:On
    </button>
    <audio id="musica-fundo" src="video_e_musica/background_music.mp3" autoplay loop preload="auto"></audio>
    <script src="js/musica.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
